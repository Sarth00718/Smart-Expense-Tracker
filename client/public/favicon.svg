<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="walletBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="walletFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- Border glow -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>

  <!-- Wallet back -->
  <rect x="18" y="36" width="92" height="58" rx="10" fill="url(#walletBack)"/>

  <!-- Wallet front flap -->
  <rect x="18" y="46" width="92" height="48" rx="10" fill="url(#walletFront)"/>

  <!-- Top highlight -->
  <rect x="18" y="46" width="92" height="3" rx="1.5" fill="#ffffff" opacity="0.1"/>

  <!-- Dashed stitching on back -->
  <line x1="26" y1="41" x2="102" y2="41" stroke="#a5b4fc" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Card lines left side -->
  <rect x="26" y="58" width="36" height="4" rx="2" fill="#ffffff" opacity="0.25"/>
  <rect x="26" y="66" width="26" height="4" rx="2" fill="#ffffff" opacity="0.18"/>
  <rect x="26" y="74" width="30" height="4" rx="2" fill="#ffffff" opacity="0.12"/>

  <!-- Coin pocket -->
  <rect x="71" y="53" width="32" height="34" rx="8" fill="#1e1b4b" opacity="0.7"/>
  <rect x="71" y="53" width="32" height="34" rx="8" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.6"/>

  <!-- Gold coin -->
  <circle cx="87" cy="70" r="12" fill="url(#coin)" filter="url(#glow)"/>
  <circle cx="87" cy="70" r="12" fill="none" stroke="#fde68a" stroke-width="1.2" opacity="0.7"/>

  <!-- ₹ Unicode character rendered as text -->
  <text x="87" y="75"
        font-family="'Noto Sans', 'Arial Unicode MS', sans-serif"
        font-size="15"
        font-weight="bold"
        fill="#92400e"
        text-anchor="middle">&#x20B9;</text>
</svg>

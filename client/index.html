<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Viewport -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#5B5FED" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ExpenseTracker" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

  <!-- Description -->
  <meta name="description"
    content="Smart Expense Tracker - Track and analyze your expenses with AI-powered insights." />

  <title>Smart Expense Tracker</title>

  <!-- Inter Variable Font (300–800) for consistent rendering everywhere -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap"
    rel="stylesheet" />

  <!-- Dark mode FOUC prevention: apply theme BEFORE React mounts -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        
        // Only apply 'dark' if explicitly set to dark
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          // Ensure dark class is removed for light mode or default
          document.documentElement.classList.remove('dark');
        }
        
        console.log('[Initial Theme Load]', theme || 'light (default)');
      } catch (e) {
        console.error('[Theme Init Error]', e);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
